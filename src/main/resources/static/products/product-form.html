<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product</title>

    <link rel="stylesheet"
          href="/products/product.css">

</head>

<body>

<div class="container form-container">

    <div class="page-header">

        <div>
            <h1 id="form-title">
                Add Product
            </h1>

            <p id="form-description">
                Create a new product
            </p>
        </div>

        <a href="/products/products.html"
           class="btn">
            ← Back
        </a>

    </div>

    <div id="message"></div>


    <form id="product-form">


        <div class="form-group">

            <label for="name">
                Name
            </label>

            <input
                    type="text"
                    id="name"
                    name="name"
                    required>

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                    id="description"
                    name="description"
                    rows="5"></textarea>

        </div>


        <div class="form-group">

            <label for="price">
                Price
            </label>

            <input
                    type="number"
                    id="price"
                    name="price"
                    min="0"
                    step="0.01"
                    required>

        </div>


        <div class="form-group">

            <label for="imageUrl">
                Image URL
            </label>

            <input
                    type="url"
                    id="imageUrl"
                    name="imageUrl"
                    placeholder="https://example.com/product.jpg">

        </div>


        <div
                class="form-group active-group"
                id="active-group">

            <label>
                <input
                        type="checkbox"
                        id="active"
                        name="active">

                Active
            </label>

        </div>


        <div class="form-actions">

            <button
                    type="submit"
                    class="btn btn-primary"
                    id="submit-button">
                Create Product
            </button>

            <a
                    href="/products/products.html"
                    class="btn">
                Cancel
            </a>

        </div>

    </form>

</div>

<script src="/products/product-form.js"></script>

</body>
</html>
