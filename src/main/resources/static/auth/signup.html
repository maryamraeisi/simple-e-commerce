<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Simple E-Commerce</title>
    <link rel="stylesheet" href="/auth/signup.css">
</head>
<body>
<div class="signup-page">
    <div class="signup-card">
        <div class="signup-header">
            <div class="logo"><span class="logo-mark">S</span> <span>Simple Shop</span></div>
            <h1>Create your account</h1>
            <p>Join us and start shopping.</p></div>
        <div id="message"></div>
        <form id="signup-form">
            <div class="name-row">
                <div class="form-group"><label for="firstName">First Name</label> <input type="text" id="firstName"
                                                                                         name="firstName"
                                                                                         placeholder="First name"
                                                                                         autocomplete="given-name"
                                                                                         required></div>
                <div class="form-group"><label for="lastName">Last Name</label> <input type="text" id="lastName"
                                                                                       name="lastName"
                                                                                       placeholder="Last name"
                                                                                       autocomplete="family-name"
                                                                                       required></div>
            </div>
            <div class="form-group"><label for="email">Email</label> <input type="email" id="email" name="email"
                                                                            placeholder="you@example.com"
                                                                            autocomplete="email" required></div>
            <div class="form-group"><label for="phoneNumber">Phone Number</label> <input type="tel" id="phoneNumber"
                                                                                         name="phoneNumber"
                                                                                         placeholder="Optional"
                                                                                         autocomplete="tel"></div>
            <div class="form-group"><label for="password">Password</label>
                <div class="password-wrapper"><input type="password" id="password" name="password"
                                                     placeholder="Create a password" autocomplete="new-password"
                                                     required>
                    <button type="button" id="toggle-password" class="password-toggle" aria-label="Show password">
                        Show
                    </button>
                </div>
            </div>
            <div class="form-group"><label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper"><input type="password" id="confirmPassword" name="confirmPassword"
                                                     placeholder="Enter your password again" autocomplete="new-password"
                                                     required>
                    <button type="button" id="toggle-confirm-password" class="password-toggle"
                            aria-label="Show password"> Show
                    </button>
                </div>
            </div>
            <button type="submit" class="signup-button" id="signup-button"> Create Account</button>
        </form>
        <div class="signup-footer"><span>Already have an account?</span> <a href="/auth/login.html">Login</a></div>
        <a href="/index.html" class="back-link"> ← Back to store </a></div>
</div>
<script src="/auth/signup.js"></script>
</body>
</html>
