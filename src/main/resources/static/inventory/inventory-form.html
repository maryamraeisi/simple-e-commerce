<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Inventory</title>

    <link rel="stylesheet" href="/common/common.css">
    <link rel="stylesheet" href="/inventory/inventory.css">
</head>

<body>

<header class="header">
    <h1>Create Inventory</h1>
    <p>Create initial inventory for a product</p>
</header>


<main class="container">

    <div class="form-page">

        <div class="page-title">
            <h2>New Inventory</h2>
            <p>
                Select a product and specify its initial stock quantity.
            </p>
        </div>


        <div id="message"
             class="message"
             style="display: none;">
        </div>


        <div class="card">

            <form id="inventoryForm">

                <div class="form-group">

                    <label for="product">
                        Product
                    </label>

                    <select id="product" required>

                        <option value="">
                            Loading products...
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="quantity">
                        Initial Quantity
                    </label>

                    <input
                            type="number"
                            id="quantity"
                            min="0"
                            required
                            placeholder="Enter initial quantity">

                </div>


                <div class="form-actions">

                    <a href="/inventory/inventory.html"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                    <button
                            type="submit"
                            class="btn btn-primary">
                        Create Inventory
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>


<footer class="footer">
    Simple E-Commerce &copy; 2026
</footer>


<script src="/common/common.js"></script>
<script src="/inventory/inventory.js"></script>

</body>
</html>
