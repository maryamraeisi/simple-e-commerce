<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Simple Shop</title>

    <link rel="stylesheet" href="/common/common.css">
    <link rel="stylesheet" href="/orders/storefront/checkout.css">
</head>

<body>

<header class="store-header">

    <a href="/index.html" class="logo">
        Simple Shop
    </a>

    <nav class="main-nav">
        <a href="/index.html">
            Products
        </a>

        <a href="/cart/storefront/cart.html">
            Cart
        </a>

        <a href="/orders/storefront/orders.html" id="my-orders-link">
            My Orders
        </a>
    </nav>

    <div class="auth-area">

        <div id="logged-out" class="auth-state" hidden>
            <a href="/auth/login.html" class="login-button">
                Login
            </a>
        </div>

        <div id="logged-in" class="auth-state" hidden>
            <span id="customer-name"></span>

            <button
                    type="button"
                    id="logout-button"
                    class="logout-button">
                Logout
            </button>
        </div>

    </div>

</header>


<main class="checkout-container">

    <section class="hero">

        <p class="eyebrow">
            Simple Shop
        </p>

        <h1>
            Checkout
        </h1>

        <p>
            Review your order before completing your payment.
        </p>

    </section>


    <div class="back-link-container">

        <a href="/cart/storefront/cart.html" class="back-link">
            ← Back to Cart
        </a>

    </div>


    <section class="checkout-section">

        <div id="loading" class="loading">
            Loading order...
        </div>


        <div id="error-message" class="message error" hidden></div>


        <div id="checkout-content" class="checkout-content" hidden>

            <div class="section-header">

                <h2>
                    Your Order
                </h2>

                <span id="order-status" class="order-status"></span>

            </div>


            <div id="order-items" class="order-items"></div>


            <div class="order-summary">

                <div class="summary-row">

                    <span>
                        Total
                    </span>

                    <span id="order-total" class="order-total"></span>

                </div>

            </div>


            <div class="payment-container">

                <button
                        type="button"
                        id="pay-button"
                        class="pay-button">
                    Pay Now
                </button>

            </div>

        </div>

    </section>

</main>


<script src="/orders/storefront/checkout.js"></script>
<script src="/common/auth.js"></script>

</body>
</html>
