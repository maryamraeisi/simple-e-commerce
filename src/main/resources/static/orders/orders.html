<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders</title>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }
        .container {
            width: min(1100px, 92%);
            margin: 40px auto;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
        }
        h1, h2, h3 { margin-top: 0; }
        .card {
            background: white;
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            border: 0;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            background: #e5e7eb;
            color: #111827;
        }
        .btn-primary { background: #2563eb; color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-secondary { background: #6b7280; color: white; }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            vertical-align: middle;
        }
        th { background: #f9fafb; }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .field { margin-bottom: 16px; }
        .row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }
        .item-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            align-items: end;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        .message {
            display: none;
            padding: 12px 14px;
            border-radius: 6px;
            margin-bottom: 18px;
        }
        .message.error { display: block; background: #fee2e2; color: #991b1b; }
        .message.success { display: block; background: #dcfce7; color: #166534; }
        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            background: #e5e7eb;
            font-size: 12px;
            font-weight: 700;
        }
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .muted { color: #6b7280; }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }
        .summary-item {
            background: #f9fafb;
            border-radius: 8px;
            padding: 14px;
        }
        .summary-item span {
            display: block;
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 5px;
        }
        @media (max-width: 760px) {
            .row, .summary-grid { grid-template-columns: 1fr; }
            .item-row { grid-template-columns: 1fr; }
            .topbar { align-items: flex-start; flex-direction: column; }
            table { font-size: 13px; }
        }
    </style>

</head>
<body>
<div class="container">
    <div class="topbar">
        <div>
            <h1>Orders</h1>
            <div class="muted">View and manage customer orders.</div>
        </div>
        <div class="actions">
            <a class="btn btn-primary" href="/orders/create-order.html">+ Create Order</a>
            <a class="btn btn-secondary" href="/index.html">← Back</a>
        </div>
    </div>

    <div id="message" class="message"></div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Status</th>
                <th>Total Price</th>
                <th>Created At</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
        </table>
    </div>
</div>

<script>
    const ordersBody = document.getElementById('ordersBody');
    const message = document.getElementById('message');

    function showError(text) {
        message.className = 'message error';
        message.textContent = text;
    }

    function formatMoney(value) {
        if (value === null || value === undefined) return '-';
        return Number(value).toFixed(2);
    }

    function formatDate(value) {
        if (!value) return '-';
        return new Date(value).toLocaleString();
    }

    async function loadOrders() {
        try {
            const response = await fetch('/api/orders');

            if (!response.ok) {
                throw new Error('Could not load orders.');
            }

            const orders = await response.json();
            ordersBody.innerHTML = '';

            if (!orders.length) {
                ordersBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="muted">No orders found.</td>
                    </tr>`;
                return;
            }

            orders.forEach(order => {
                const row = document.createElement('tr');

                row.innerHTML = `
                    <td>${order.id}</td>
                    <td>${order.customerId ?? '-'}</td>
                    <td><span class="status">${order.status ?? '-'}</span></td>
                    <td>${formatMoney(order.totalPrice)}</td>
                    <td>${formatDate(order.createdAt)}</td>
                    <td>
                        <div class="actions">
                            <a class="btn btn-primary"
                               href="/orders/order-details.html?id=${order.id}">
                                View
                            </a>
                            ${order.status !== 'CANCELLED' ? `
                                <button class="btn btn-danger"
                                        onclick="cancelOrder(${order.id})">
                                    Cancel
                                </button>` : ''}
                        </div>
                    </td>
                `;

                ordersBody.appendChild(row);
            });
        } catch (error) {
            showError(error.message);
        }
    }

    async function cancelOrder(id) {
        if (!confirm(`Cancel order #${id}?`)) {
            return;
        }

        try {
            const response = await fetch(`/api/orders/${id}/cancel`, {
                method: 'PATCH'
            });

            if (!response.ok) {
                throw new Error('Could not cancel the order.');
            }

            await loadOrders();
        } catch (error) {
            showError(error.message);
        }
    }

    loadOrders();
</script>
</body>
</html>
